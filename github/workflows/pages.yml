name: Deploy PWA (GitHub Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: UP Studio · PWA
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      # Relative base so the app works under https://<user>.github.io/<repo>/
      - name: Build (relative paths)
        run: npx vite build --base=./

      - name: Make public asset links relative (manifest, icons, sw)
        run: |
          sed -i -E 's#(href|src|content)="/(manifest|icons|sw\.js)#\1="./\2#g' dist/index.html
          touch dist/.nojekyll
          grep -o 'manifest[^"]*' dist/index.html | head -1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
