name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build UP Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Find APK
        run: |
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk UP-Studio.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: UP Studio — Android (latest)
          body: |
            ## UP Studio Android

            Latest Android APK built automatically by GitHub Actions.

            **App ID:** `com.upstudio.app`

            Download `UP-Studio.apk` below and install it on your Android device.
          files: UP-Studio.apk
          overwrite_files: true
          make_latest: true
