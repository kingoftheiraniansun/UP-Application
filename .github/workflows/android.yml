name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  android:
    name: UP Studio - Android
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Show environment
        run: |
          echo "Node:"
          node --version
          echo "NPM:"
          npm --version
          echo "Java:"
          java -version

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            echo "Android project not found."
            echo "Creating Android project..."
            npx cap add android
          else
            echo "Android project already exists."
          fi

      - name: Prepare Android app icon
  run: |
    mkdir -p assets

    if [ ! -f "public/media/logo/upstudio-logo.png" ]; then
      echo "ERROR: public/media/logo/upstudio-logo.png was not found."
      exit 1
    fi

    cp public/media/logo/upstudio-logo.png assets/icon-only.png

    echo "Android icon prepared from UP Studio logo."
    file assets/icon-only.png

          echo "Android icon prepared."
          file assets/icon-only.png

      - name: Install Capacitor Assets
        run: npm install --no-save @capacitor/assets

      - name: Generate native Android icon resources
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upstudio-release.jks"

          if [ ! -s "$RUNNER_TEMP/upstudio-release.jks" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "Release keystore prepared successfully."

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align and sign APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"

          UNSIGNED=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*-unsigned.apk" \
            | head -n 1)

          if [ -z "$UNSIGNED" ]; then
            echo "ERROR: Unsigned APK was not found."

            echo "Available APK/build files:"
            find android/app/build/outputs -type f -print 2>/dev/null || true

            exit 1
          fi

          echo "Unsigned APK:"
          echo "$UNSIGNED"

          "$BT/zipalign" \
            -p \
            -f \
            4 \
            "$UNSIGNED" \
            aligned.apk

          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/upstudio-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out UP-Studio.apk \
            aligned.apk

          "$BT/apksigner" verify \
            --verbose \
            --print-certs \
            UP-Studio.apk

          cp UP-Studio.apk "UP-Studio-build${{ github.run_number }}.apk"

          echo "Final APK files:"
          ls -lh UP-Studio*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UP-Studio-APK
          path: |
            UP-Studio.apk
            UP-Studio-build${{ github.run_number }}.apk
          retention-days: 90

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            echo "Existing release found."
            echo "Uploading new APK files..."

            gh release upload \
              android-latest \
              UP-Studio.apk \
              "UP-Studio-build${{ github.run_number }}.apk" \
              --clobber
          else
            echo "Creating new release..."

            gh release create \
              android-latest \
              UP-Studio.apk \
              "UP-Studio-build${{ github.run_number }}.apk" \
              --title "UP Studio - Android (latest)" \
              --notes "Latest UP Studio Android APK. Build #${{ github.run_number }}."
          fi

      - name: Cleanup sensitive keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/upstudio-release.jks"
          rm -f release.keystore
