name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: write

jobs:
build-android:
name: Build UP Studio APK
runs-on: ubuntu-24.04

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22
      cache: npm

  - name: Setup Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '21'

  - name: Show environment
    run: |
      echo "Node:"
      node --version
      echo "NPM:"
      npm --version
      echo "Java:"
      java -version

  - name: Install dependencies
    run: npm install

  - name: Build web application
    run: npm run build

  - name: Create Android project if needed
    run: |
      if [ ! -d "android" ]; then
        echo "Android project not found."
        echo "Creating Android project with Capacitor..."
        npx cap add android
      else
        echo "Android project already exists."
      fi

        - name: Prepare Android app icon
          run: |
            mkdir -p assets
            cp public/icons/icon-512.png assets/icon-only.png

        - name: Install Capacitor Assets
          run: npm install --no-save @capacitor/assets

        - name: Generate native Android icon resources
          run: npx capacitor-assets generate --android

  - name: Sync Capacitor Android
    run: npx cap sync android

  - name: Make Gradle executable
    run: chmod +x android/gradlew

  - name: Decode release keystore
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    run: |
      echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upstudio-release.jks"
      test -s "$RUNNER_TEMP/upstudio-release.jks"

  - name: Build signed Android APK
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    run: |
      npx cap build android \
        --keystorepath "$RUNNER_TEMP/upstudio-release.jks" \
        --keystorepass "$ANDROID_KEYSTORE_PASSWORD" \
        --keystorealias "$ANDROID_KEY_ALIAS" \
        --keystorealiaspass "$ANDROID_KEY_PASSWORD" \
        --androidreleasetype APK \
        --signing-type jarsigner

  - name: Inspect Android build outputs
    run: |
      echo "APK files:"
      find android -type f -name "*.apk" -print

  - name: Prepare APK
    run: |
      APK=$(find android -type f -name "*.apk" | head -n 1)

      if [ -z "$APK" ]; then
        echo "ERROR: No APK file was found."
        find android/app/build -type f -print 2>/dev/null || true
        exit 1
      fi

      echo "Found APK: $APK"
      cp "$APK" UP-Studio.apk

      echo "Final APK:"
      ls -lh UP-Studio.apk

  - name: Create or update GitHub Release
    env:
      GH_TOKEN: ${{ github.token }}
    run: |
      if gh release view android-latest >/dev/null 2>&1; then
        echo "Existing release found."
        echo "Uploading new APK..."

        gh release upload \
          android-latest \
          UP-Studio.apk \
          --clobber
      else
        echo "Creating new release..."

        gh release create \
          android-latest \
          UP-Studio.apk \
          --title "UP Studio — Android (latest)" \
          --notes "Latest Android APK built automatically by GitHub Actions."
      fi
