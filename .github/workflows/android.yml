name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build UP Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Create Android project if needed
        run: |
          if [ ! -d "android" ]; then
            echo "Android project not found. Creating it with Capacitor..."
            npx cap add android
          else
            echo "Android project already exists."
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Find generated APK
        run: |
          echo "Searching for generated APK..."
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk UP-Studio.apk
          ls -lh UP-Studio.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            echo "Updating existing release..."
            gh release upload android-latest UP-Studio.apk --clobber
          else
            echo "Creating new release..."
            gh release create android-latest UP-Studio.apk \
              --title "UP Studio — Android (latest)" \
              --notes "Latest Android APK built automatically by GitHub Actions."
          fi
