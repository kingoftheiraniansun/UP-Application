name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build UP Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Show environment
        run: |
          echo "Node:"
          node --version
          echo "NPM:"
          npm --version
          echo "Java:"
          java -version

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Create Android project if needed
        run: |
          if [ ! -d "android" ]; then
            echo "Android project not found."
            echo "Creating Android project with Capacitor..."
            npx cap add android
          else
            echo "Android project already exists."
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Inspect Android build outputs
        run: |
          echo "======================================"
          echo "APK files:"
          echo "======================================"

          find android -type f -name "*.apk" -print

          echo ""
          echo "======================================"
          echo "Build output directories:"
          echo "======================================"

          find android/app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true

      - name: Prepare APK
        run: |
          echo "Searching for generated APK..."

          APK=$(find android -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK file was found."
            echo ""
            echo "Full build directory:"
            find android/app/build -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          cp "$APK" UP-Studio.apk

          echo ""
          echo "Final APK:"
          ls -lh UP-Studio.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            echo "Existing release found."
            echo "Uploading new APK..."

            gh release upload \
              android-latest \
              UP-Studio.apk \
              --clobber

          else
            echo "Creating new release..."

            gh release create \
              android-latest \
              UP-Studio.apk \
              --title "UP Studio — Android (latest)" \
              --notes "Latest Android APK built automatically by GitHub Actions."
          fi
